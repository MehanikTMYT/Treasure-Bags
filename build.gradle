plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
sourceSets.main.resources { srcDir 'src/generated/resources'; exclude '**/.cache/**' }
repositories {
    mavenCentral()
    maven { url 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data { clientData(); programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly 'mezz.jei:jei-26.1.2-common-api:29.43.0.107'
    compileOnly 'mezz.jei:jei-26.1.2-neoforge-api:29.43.0.107'
implementation "maven.modrinth:silent-lib:Rc4eCDXl"
}
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
            issue_tracker_url      : issue_tracker_url, display_url: display_url,
            silentlib_version_range: silentlib_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}


publishing { publications { mavenJava(MavenPublication) { from components.java } } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
